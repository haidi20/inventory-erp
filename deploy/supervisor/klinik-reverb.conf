; Laravel Reverb (WebSocket server) -- production.
; Asumsi path: /var/www/klinik (sesuaikan dengan path deploy aktual).
; Pasang: cp deploy/supervisor/klinik-reverb.conf /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update

[program:klinik-reverb]
command=php /var/www/klinik/src/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/klinik-reverb.log
