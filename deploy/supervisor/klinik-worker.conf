; Queue worker (redis) -- production.
; Asumsi path: /var/www/klinik (sesuaikan dengan path deploy aktual).
; Pasang: cp deploy/supervisor/klinik-worker.conf /etc/supervisor/conf.d/ && supervisorctl reread && supervisorctl update

[program:klinik-worker]
command=php /var/www/klinik/src/artisan queue:work redis --sleep=3 --tries=3 --backoff=10 --max-time=3600
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/klinik-worker.log
