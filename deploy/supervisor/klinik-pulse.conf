; Pulse daemon (alternatif scheduler --once): snapshot Servers + ingest + trim.
; Pilihan deployment:
;   1. Default (sudah terpasang di kode): cron `php artisan schedule:run`
;      tiap menit -- scheduler menjalankan `pulse:check --once` (17.74).
;   2. Daemon via file ini: TIDAK perlu item 1 untuk pulse (scheduler lain
;      tetap jalan). Jalankan salah satu, bukan keduanya.

[program:klinik-pulse]
command=php /var/www/klinik/src/artisan pulse:check
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/klinik-pulse.log
