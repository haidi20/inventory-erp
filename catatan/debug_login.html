	<script>
		$(document).ready(function() {
			$('input[name="email"]').val('');
			$('input[name="password"]').val('');
			if (0) {
				$('#login_submit').click();
			}
			$('input[name="email"]').on('change', function() {
				remember();
			});
			$('input[name="password"]').on('change', function() {
				remember();
			});
			$('input[name="remember"]').on('change', function() {
				remember();
			});
			$('#daftar').on('click', function() {
				window.location = 'https://web.ninesoft.id/site/sign_up';
			});
			$('.forget').on('click', function() {
				window.location = 'https://web.ninesoft.id/site/forget';
			});
			if (getCookie('email') != '') {
				$('input[name="email"]').val(getCookie('email'));
				$('input[name="password"]').val(getCookie('password'));
				$('input[name="remember"]').prop('checked', true);
			}
		});
		if (0) {
			window.location.href = '';
		}
		$('#login_mp').on('click', function() {
			$.ajax({
				url: 'https://web.ninesoft.id/site/login_mp/cek_Login',
				type: 'POST',
				data: $('#form-login').serializeArray(),
				dataType: "JSON",
				success: function(data) {
					if (data.error) {
						// console.log(data);
						window.location.replace(data.url + "/login?id=" + data.access + "&pass=" + data.refresh);
					}
				},
				error: function(jqXHR, textStatus, errorThrown) {
					var msg = "";
					if (jqXHR.status === 0) {
						msg = "Not connect.\n Verify Network.";
					} else if (jqXHR.status == 404) {
						msg = "Requested page not found. [404]";
					} else if (jqXHR.status == 500) {
						msg = "Internal Server Error [500].";
					} else if (textStatus === "parsererror") {
						msg = "Ada Kesalahan Data"; // 'Requested JSON parse failed.';
					} else if (textStatus === "timeout") {
						msg = "Time out error.";
					} else if (textStatus === "abort") {
						msg = "Ajax request aborted.";
					} else {
						msg = "Uncaught Error.\n" + jqXHR.responseText;
					}
					alert(msg);
				},
			});
		});

		function remember() {
			if ($('input[name="remember"]').is(':checked')) {
				setCookie('email', $('input[name="email"]').val(), 30);
				setCookie('password', $('input[name="password"]').val(), 30);
			} else {
				setCookie('email', '', 30);
				setCookie('password', '', 30);
			}
		}

		function setCookie(cname, cvalue, exdays) {
			const d = new Date();
			d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
			let expires = "expires=" + d.toUTCString();
			document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
		}

		function getCookie(cname) {
			let name = cname + "=";
			let decodedCookie = decodeURIComponent(document.cookie);
			let ca = decodedCookie.split(';');
			for (let i = 0; i < ca.length; i++) {
				let c = ca[i];
				while (c.charAt(0) == ' ') {
					c = c.substring(1);
				}
				if (c.indexOf(name) == 0) {
					return c.substring(name.length, c.length);
				}
			}
			return "";
		}
