services:

  # ============================================================
  # DATABASE
  # ============================================================
  mysql_dev:
    image: mysql:8.0
    container_name: inventory_mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DEV_DATABASE:-app_db_dev}
      MYSQL_USER: ${MYSQL_USER:-klinik}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-klinikpassword}
    ports:
      - "${MYSQL_DEV_PORT:-13306}:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_network

  mysql_main:
    image: mysql:8.0
    container_name: inventory_mysql_main
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_MAIN_DATABASE:-app_db_main}
      MYSQL_USER: ${MYSQL_USER:-klinik}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-klinikpassword}
    ports:
      - "${MYSQL_MAIN_PORT:-13307}:3306"
    volumes:
      - mysql_main_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_network

  # ============================================================
  # CACHE
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: inventory_redis
    restart: unless-stopped
    command: >
      sh -lc "if [ -n \"$REDIS_PASSWORD\" ];
      then redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\";
      else redis-server --appendonly yes; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./runtime/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG; else redis-cli ping | grep PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_network

  # ============================================================
  # OBJECT STORAGE
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: inventory_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_network

  minio_init:
    image: minio/mc:latest
    container_name: inventory_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-klinik-storage};
      mc anonymous set download local/${MINIO_BUCKET:-klinik-storage};
      echo 'MinIO bucket initialized';
      "
    networks:
      - inventory_network

  # ============================================================
  # APPLICATION
  # ============================================================
  app_dev:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: dev
    container_name: inventory_app_dev
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: ${APP_URL_DEV:-http://localhost:8088}
      DB_CONNECTION: mysql
      DB_HOST: mysql_dev
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DEV_DATABASE:-app_db_dev}
      DB_USERNAME: ${MYSQL_USER:-klinik}
      DB_PASSWORD: ${MYSQL_PASSWORD:-klinikpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-klinik-storage}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    working_dir: /var/www/html
    depends_on:
      mysql_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../src:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - inventory_network

  app_main:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: prod
    container_name: inventory_app_main
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL_MAIN:-http://localhost:8089}
      DB_CONNECTION: mysql
      DB_HOST: mysql_main
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_MAIN_DATABASE:-app_db_main}
      DB_USERNAME: ${MYSQL_USER:-klinik}
      DB_PASSWORD: ${MYSQL_PASSWORD:-klinikpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-klinik-storage}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      mysql_main:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - inventory_network

  # ============================================================
  # WEB SERVER (1 nginx handle dev + main via port berbeda)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    restart: unless-stopped
    depends_on:
      app_dev:
        condition: service_healthy
    ports:
      - "${NGINX_DEV_PORT:-8088}:80"
      - "${NGINX_MAIN_PORT:-8089}:8089"
    volumes:
      - ../src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory_network

  # ============================================================
  # DB MANAGER
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inventory_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOSTS: mysql_dev,mysql_main
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - inventory_network

  # ============================================================
  # CI/CD
  # ============================================================
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: inventory_jenkins:dev
    container_name: inventory_jenkins
    restart: unless-stopped
    user: root
    environment:
      JENKINS_OPTS: --prefix=/cicd
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-qwerty123}
      JENKINS_DEV_BRANCH: ${JENKINS_DEV_BRANCH:-dev}
      JENKINS_PROD_BRANCH: ${JENKINS_PROD_BRANCH:-main}
    ports:
      - "${JENKINS_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50010}:50000"
    volumes:
      - ./runtime/jenkins:/var/jenkins_home
      - ./jenkins/init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ../:/workspace/klinik-starter
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inventory_network

volumes:
  mysql_dev_data:
  mysql_main_data:
  minio_data:

networks:
  inventory_network:
    driver: bridge