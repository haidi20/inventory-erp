# Docker internal DNS resolver with 30s validity
resolver 127.0.0.11 valid=30s;

server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name localhost;

    # === DEV Environment ===
    location /dev/ {
        set $target_url "http://172.22.0.20:3000";
        proxy_pass $target_url;    # fe_dev static IP, prefix /dev dipertahankan untuk Vite base
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection stability
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /dev/api/ {
        set $target_url "http://172.22.0.30:8001";
        rewrite ^/dev/api(/.*)$ $1 break;
        proxy_pass $target_url;     # be_dev static IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Connection stability
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }



    # === CI/CD ===
    location /jenkins/ {
        set $target_url "http://172.22.0.40:8080";
        proxy_pass $target_url/jenkins/; # jenkins static IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
