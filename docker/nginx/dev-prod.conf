server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;

    # === CI/CD ===
    location = /cicd {
        return 301 /cicd/;
    }

    location = /cicd/ {
        proxy_pass http://172.22.0.40:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @cicd_unavailable;
    }

    location ^~ /cicd/ {
        proxy_pass http://172.22.0.40:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @cicd_unavailable;
    }

    location @cicd_unavailable {
        default_type text/html;
        add_header Cache-Control "no-store";
        return 503 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>CI/CD Starting</title></head><body><h1>CI/CD belum siap</h1><p>Jenkins masih starting atau belum sehat.</p></body></html>';
    }

    location = /dev/cicd {
        return 301 /cicd/;
    }

    location = /dev/cicd/ {
        return 301 /cicd/;
    }

    location ^~ /dev/cicd/ {
        return 301 /cicd/;
    }

    location = /prod/cicd {
        return 301 /cicd/;
    }

    location = /prod/cicd/ {
        return 301 /cicd/;
    }

    location ^~ /prod/cicd/ {
        return 301 /cicd/;
    }

    # === DEV Environment ===
    location = /dev/api/health {
        proxy_pass http://172.22.0.30:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 = @dev_api_unavailable;
    }

    location ^~ /dev/api/ {
        rewrite ^/dev/api(/.*)$ $1 break;
        proxy_pass http://172.22.0.30:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 = @dev_api_unavailable;
    }

    location @dev_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"service":"be","environment":"dev","status":"starting"}';
    }

    location ^~ /dev/assets/ {
        alias /usr/share/nginx/html/dev/current/assets/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /dev {
        return 301 /dev/;
    }

    location = /dev/ {
        try_files /dev/current/index.html =404;
    }

    location ^~ /dev/ {
        rewrite ^/dev/?(.*)$ /$1 break;
        try_files /dev/current$uri /dev/current$uri/index.html /dev/current/index.html =404;
    }

    # === PROD Environment ===
    location = /prod/api/health {
        proxy_pass http://172.22.0.31:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
        error_page 502 503 504 = @prod_api_unavailable;
    }

    location ^~ /prod/api/ {
        rewrite ^/prod/api(/.*)$ $1 break;
        proxy_pass http://172.22.0.31:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @prod_api_unavailable;
    }

    location @prod_api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"service":"be","environment":"prod","status":"starting"}';
    }

    location ^~ /prod/assets/ {
        alias /usr/share/nginx/html/prod/current/assets/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /prod {
        return 301 /prod/;
    }

    location = /prod/ {
        try_files /prod/current/index.html =404;
    }

    location ^~ /prod/ {
        rewrite ^/prod/?(.*)$ /$1 break;
        try_files /prod/current$uri /prod/current$uri/index.html /prod/current/index.html =404;
    }
}
