name: Application CI

on:
  push:
    branches:
      - main
      - master
      - dev
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-pint:
    name: PHP Pint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Prepare directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check formatting
        run: composer ci:pint

  php-static:
    name: PHP Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Prepare directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Module boundaries
        run: composer ci:module-boundaries
      - name: PHPStan / Larastan
        run: composer ci:phpstan
      - name: Deptrac
        run: composer ci:deptrac

  php-tests:
    name: PHP Tests Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: xdebug
      - name: Prepare directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Run PHPUnit
        run: vendor/bin/phpunit --coverage-clover ../coverage/php-clover.xml
      - name: Coverage gate
        run: php ../scripts/check-clover-coverage.php ../coverage/php-clover.xml 1

  frontend-typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  frontend-vitest:
    name: Vitest Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run test:coverage
      - name: Coverage gate
        run: npm run ci:coverage:vitest

  playwright:
    name: Playwright E2E Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      KLINIK_TEST_BASE_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Prepare directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Prepare test database
        run: |
          mkdir -p database
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
      - name: Prepare application environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=app_db_dev|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's/DB_HOST=127.0.0.1//' .env
          sed -i 's/DB_PORT=13306//' .env
          sed -i 's/DB_USERNAME=klinik//' .env
          sed -i 's/DB_PASSWORD=klinikpassword//' .env
          sed -i 's/SESSION_DRIVER=redis/SESSION_DRIVER=file/' .env
          sed -i 's/CACHE_STORE=redis/CACHE_STORE=array/' .env
          sed -i 's/QUEUE_CONNECTION=redis/QUEUE_CONNECTION=sync/' .env
          php artisan key:generate --force
      - name: Debug seeded auth user
        run: php scripts/ci/debug-auth.php
      - name: Run Playwright
        run: npm run e2e:report
      - name: Coverage gate
        if: always()
        run: npm run ci:coverage:playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            src/test-results/
            src/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-log
          path: playwright-e2e.log
          retention-days: 7
