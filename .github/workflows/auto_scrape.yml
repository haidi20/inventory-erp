name: Advanced E2E Documentation Scraper

on:
  push:
    branches:
      - main  # Trigger workflow ketika kode disatukan dengan production branch.
  schedule:
    - cron: '0 0 * * 0' # Menjalankan QA pengecekan secara rutin setiap minggu (Minggu Malam).
  workflow_dispatch: # Memungkinkan eksekusi manual via tab Actions.

jobs:
  scrape-and-document:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright bs4
          playwright install chromium

      - name: Run Advanced Web Scraping QA
        run: python catatan/catatan_app_advanced.py

      - name: Lacak Perubahan (Diff-Checker)
        id: git-check
        run: |
          git status
          git diff --quiet || echo "::set-output name=modified::true"

      - name: Git Commit Dokumentasi Visual Terkini
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name "Github Action QA Bot"
          git config --global user.email "qa-bot@rhantech.com"
          git add catatan/catatan_app.md catatan/assets/ catatan/auth.json
          git commit -m "docs(test): Auto-update markdown docs and Visual QA Screenshots."
          git push
